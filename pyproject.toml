[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goddard-psm"
version = "0.1.0"
description = "Pseudo-Spectral Method Solver for DDFT"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]